<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <title>Shared Workbench</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #070b14;
        color: #f1f4fd;
        font-family: system-ui, sans-serif;
      }
      main { width: min(680px, 100%); }
      p { color: rgba(241, 244, 253, .58); line-height: 1.7; }
      a {
        display: block;
        margin-top: 28px;
        padding: 24px;
        border: 1px solid rgba(245, 158, 11, .35);
        border-radius: 16px;
        background: #111827;
        color: #ffc478;
        font-size: 20px;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover { border-color: #f59e0b; }
      small { display: block; margin-top: 8px; color: rgba(241, 244, 253, .48); font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Shared Workbench</h1>
      <p>함께 만드는 프로젝트를 폴더별로 모아둔 작업실입니다.</p>
      <a href="./ilju-team-chemistry/">
        일주 팀플 케미
        <small>일주로 가볍게 알아보는 커뮤니티 협업 케미</small>
      </a>
    </main>
  </body>
</html>
