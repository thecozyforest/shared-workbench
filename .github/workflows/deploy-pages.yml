name: Deploy shared workbench pages

on:
  push:
    branches: [main]
    paths:
      - "ilju-team-chemistry/**"
      - "pages/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ilju-team-chemistry/package-lock.json

      - name: Install dependencies
        working-directory: ilju-team-chemistry
        run: npm ci

      - name: Build ilju team chemistry
        working-directory: ilju-team-chemistry
        run: npm run build:github

      - name: Assemble Pages directory
        run: |
          mkdir -p pages/ilju-team-chemistry
          cp -R ilju-team-chemistry/github-pages/. pages/ilju-team-chemistry/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

